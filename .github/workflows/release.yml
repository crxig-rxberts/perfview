name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Tag and draft the release
    if: github.repository == 'crxig-rxberts/perfview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check release credentials
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_IT_GITHUB_TOKEN }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
        run: |
          if [ -z "$RELEASE_TOKEN" ] || [ -z "$GIT_EMAIL" ] || [ -z "$GIT_USERNAME" ]; then
            echo "::error::Configure RELEASE_IT_GITHUB_TOKEN, GIT_EMAIL and GIT_USERNAME repository secrets."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.RELEASE_IT_GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git remote credentials
        run: |
          git remote set-url origin \
            "https://x-access-token:${{ secrets.RELEASE_IT_GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Run release-it
        uses: juancarlosjr97/release-it-containerized@e71560962e77fe21d9b60836c386241392abe37e # 2.2.14
        with:
          git_email: ${{ secrets.GIT_EMAIL }}
          git_username: ${{ secrets.GIT_USERNAME }}
          github_token: ${{ secrets.RELEASE_IT_GITHUB_TOKEN }}
          plugins_list: "@release-it/conventional-changelog,@release-it/bumper"
          command: "--config .release-it.mjs"
