name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: Build ${{ matrix.target }}
    if: github.repository == 'crxig-rxberts/perfview'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            cross: false
          - target: aarch64-unknown-linux-gnu
            cross: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb00c93b4d84f5432c38bd # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --profile dist --target ${{ matrix.target }} --locked
          else
            cargo build --profile dist --target ${{ matrix.target }} --locked
          fi

      - name: Package tarball
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          staging="perfview-${version}-${{ matrix.target }}"
          mkdir -p "dist/${staging}"
          cp "target/${{ matrix.target }}/dist/perfview" "dist/${staging}/"
          cp README.md LICENSE CHANGELOG.md "dist/${staging}/" 2>/dev/null || true
          cp packaging/perfview.desktop "dist/${staging}/"
          tar -czf "dist/${staging}.tar.gz" -C dist "${staging}"
          (cd dist && sha256sum "${staging}.tar.gz" > "${staging}.tar.gz.sha256")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build Debian package
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-deb --locked --version 2.14.1
          cargo deb --profile dist --target ${{ matrix.target }} --no-build \
            --output "dist/perfview_${{ steps.package.outputs.version }}_amd64.deb"
          (cd dist && sha256sum "perfview_${{ steps.package.outputs.version }}_amd64.deb" \
            > "perfview_${{ steps.package.outputs.version }}_amd64.deb.sha256")

      - name: Upload release assets
        uses: softprops/action-gh-release@f2df91e00f4e4d9a5b8ca0f5e9aa4edef90e7e95 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.deb
          fail_on_unmatched_files: false

  crate:
    name: Publish to crates.io
    if: github.repository == 'crxig-rxberts/perfview'
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb00c93b4d84f5432c38bd # stable

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
