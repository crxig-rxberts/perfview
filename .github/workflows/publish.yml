name: publish

on:
  pull_request:
    paths:
      - ".github/workflows/publish.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packaging/**"
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: Build ${{ matrix.target }}
    if: github.repository == 'crxig-rxberts/perfview'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --profile dist --target ${{ matrix.target }} --locked

      - name: Confirm the binary runs
        run: ./target/${{ matrix.target }}/dist/perfview --help

      - name: Package tarball
        id: package
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "::error::Release tag does not match Cargo.toml version ${version}."
            exit 1
          fi
          staging="perfview-${version}-${{ matrix.target }}"
          mkdir -p "dist/${staging}"
          cp "target/${{ matrix.target }}/dist/perfview" "dist/${staging}/"
          cp README.md LICENSE CHANGELOG.md "dist/${staging}/"
          cp packaging/perfview.desktop "dist/${staging}/"
          tar -czf "dist/${staging}.tar.gz" -C dist "${staging}"
          (cd dist && sha256sum "${staging}.tar.gz" > "${staging}.tar.gz.sha256")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build Debian package
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-deb --locked --version 2.14.1
          cargo deb --profile dist --target ${{ matrix.target }} --no-build \
            --output "dist/perfview_${{ steps.package.outputs.version }}_amd64.deb"
          (cd dist && sha256sum "perfview_${{ steps.package.outputs.version }}_amd64.deb" \
            > "perfview_${{ steps.package.outputs.version }}_amd64.deb.sha256")

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.deb
          fail_on_unmatched_files: false

  crate:
    name: Publish to crates.io
    if: github.repository == 'crxig-rxberts/perfview'
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Configure the CARGO_REGISTRY_TOKEN repository secret."
            exit 1
          fi
          cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Verify crate packaging
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: cargo publish --dry-run --locked
